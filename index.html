
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ufeff Game</title>
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <style>
        body,button {
            font-family: fantasy, Arial, sans-serif;
            flex-direction: column;
            background-color: #f0f0f0;
            background-color: lightgreen;
        }
        body.active{
                margin-bottom: 500px;
            background: lightgreen;
            background-size:93px 166px;
            background: url("img/ufeff_tiles_v2.png") -150px 0px repeat-x;
            background-blend-mode: multiply;
            background-color: teal;
        }
        #game-container{
            height: 90vh;
        }
        #game-container, #editor-container {
            display: none;
        }
        #game-container.active, #editor-container.active {
            display: block;
            padding-top: 57px;
            overflow: auto;
        }
        #editor-container, #editor-container.active {
            padding-top: 167px;
            height: 74vh;
        }
        canvas {
            border: 0px solid #333;
            background-color: #000;
            overflow:auto;
            image-rendering: pixelated;
        }
        #controls, #editor-controls {
            position:fixed;
            top: 10px;
            border: solid 1px black;
            background: green;
            right: 1%;
        }
        #editor-controls {
            top:0px;
            right: 10%;
        }
        #editor-container button:hover,
        #controls button:hover{
            color: lightgreen;
            background: black;
        }
        #editor-container button,
        #controls button{
            font-size: 30px;
            padding-top: 16px;
            line-height: 18px;
            margin: 0;
        }
        button {
            margin: 0px;
            padding: 2px;
            font-size: 16px;
            cursor: pointer;
        }
        #editor-container #editor-controls button{
            font-size:13px;
            padding: 5px;
            line-height: 15px;
            margin: 0;
        }
        select {
            padding: 5px;
            font-size: 16px;
        }
        #status,
        #selected_status{
            position:fixed;
            border: solid 1px black;
            padding: 2px;
            top:0px;
            right:18%;
            background: rgba(255, 255, 255, 0.7);
            background: rgba(200, 255, 150, 0.8);
            font-weight: 700;
            font-size: 18px;
        }
        #status{
            display:inline-block;
            position:relative;
            right:1%;
            width: 145px;
            top: 50px;
            background: rgba(255, 255, 255, 0.5);
            background: rgba(0, 255, 0, 0.7);
            font-weight: 700;
            right: auto;
            top: auto;
            font-size: 18px;
            height:24px;
            overflow: scroll;
        }
        #selected_status:empty {
            display: none;
        }
        #mode-controls{
            position:relative;
            display:inline-block;
            right:auto;
            background: green;
        }
        li{
            list-style-type: none;
            display: inline-block;
        }
        ul{
            padding:0;
            margin: 0;
        }
        h1{
            border: solid 1px black;
            position:fixed;
            margin: 0;
            display: inline-block;
            background: green;
            padding: 2px;
            padding-top: 15px;
            line-height: 30px;
            cursor: pointer;
        }
        #castle_menu{
            display: none;
            position:absolute;
        }
        #overlay p{
            margin-bottom: 0;
        }
        #overlay{
            display: block;
            position: absolute;
            width: 99%;
            height: 1000px;
            background: rgba(0, 0, 0, .7);
            color: white;
            font-size: 300%;
            text-align: center;
            padding-top: 25%;
            z-index: 1;
            height: 85vh;
        }
        #map_menu{

            position: absolute;
          margin: 10%;
          background: white;
          padding: 8%;
            font-size: 120%;
            width: 60%;
            z-index:1;
        }
        #map_menu:empty{
            display:none;
        }
        #map_menu p{ 
            display: inline-block;
            cursor: pointer;
        }
        #map_menu p.d{
            float:right;
        }
        button.show_sprites,
        button.show{
            position: fixed
                ;
            top: 0;
            right:0;
            z-index:1;
        }
        button.show_sprites{

            top: 40px;
        }
        textarea{
            width:100%;
            height: 50px;
        }
        </style>
    </head>
    <body>
        <div id="overlay" style="display:none"><p>Loading</p> <button onclick="this.parentNode.style.display = 'none'">OK</button></div>
        <canvas id="anime-canvas" width="150" height="200" style="position:absolute; left: 0; top: 0; display: none"></canvas>
        <h1 onclick="toggleMenu()">ufeff 
                <div id="status" >Player 1, turn 0</div>
            <div id="menu" style="display: none;"> 
                <div id="mode-controls">
                    <button onclick="switchMode('gamesingle')">Play Single</button>
                    <button onclick="switchMode('editor')">Map Editor</button>
                    <button onclick="loadMap()">Load map</button>
                </div>
            </div>
        </h1> 
        <div id="map_menu"></div>

        <div id="game-container">
            <div id="controls">
                <button onclick="endTurn()">End Turn</button>
                <!--
-->
            </div>

            <div id="selected_status" onclick="this.innerHTML = '';"></div>
            <canvas id="game-canvas" width="1600" height="1600"></canvas>
        </div>
        <div id="editor-container">
            <button class="show" onclick="toggleControls()">menu</button>
            <button class="show_sprites" onclick="toggleSprites()">sprites</button>
            <div id="editor-controls">
                <input type="text" id="map_name" name="map_name" onchange="currentMapName=this.value" placeholder="Map name" /><br />
                <button onclick="saveMap()">Save Map</button>
                <button onclick="clearMap()">Clear Map</button>
                <button onclick="clearUnits()">Clear units</button>
                <button onclick="downloadMap()">Download Map</button>
                <br />
                <input type="file" name="file" onchange="readText(event)" />
            </div>
            <canvas id="editor-canvas" width="1600" height="1600"></canvas>
            <div style="font-size: 15px;position: fixed;
    bottom: 0;
    background: sandybrown;">
                <button onclick="selectedTile = false">unselect</button>
                <br />
                <input type="checkbox" id="is_unit" />unit (not tile);
                <input type="checkbox" id="is_layer" />2nd layer ( tile);
                <input type="checkbox" id="is_clear" />Clear ( tile/layer/unit );
                <input type="checkbox" id="is_double" checked />Double size; 
                <br />
                <input type="checkbox" id="is_player" />Player;
                <input type="checkbox" id="is_obsticle" />Obsticle;
                <input type="checkbox" id="is_info" checked />info;
                <input type="checkbox" id="is_hide_units" />hide units;
                <input type="checkbox" id="is_hide_layer" />hide layer;
                <input type="text" id="its_purpose" />purpose;
                
                <br />
                <div id="selected_id"></div> <textarea id="selected_json"></textarea>
            </div>
            <canvas id="spriteCanvas" width="256" height="272" style="    bottom: 0px;
    position: fixed;"></canvas>
        </div>
        <a id="downloadAnchorElem" style="display:none"></a>
        <script src="script.js"></script>
    </body>
</html>
